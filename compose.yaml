services:
  dcmviewer:
    build: .
    image: dcmviewer-platform
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Upload file names use this time zone (yyyyMMddHHmmss).
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      # Replace with a host folder for real data, e.g. /srv/ct:/data (UID 1000 needs read, and write for uploads).
      - dcmviewer-data:/data
      - dcmviewer-state:/state
    restart: unless-stopped

volumes:
  dcmviewer-data:
  dcmviewer-state:
